<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EAF2FB"/>
      <stop offset="100%" stop-color="#F7FAFD"/>
    </linearGradient>
    <linearGradient id="facade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E5590"/>
      <stop offset="100%" stop-color="#1B3A63"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BFE3D6"/>
      <stop offset="100%" stop-color="#9FD4C0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="560" fill="url(#sky)"/>

  <!-- sol -->
  <rect x="0" y="470" width="800" height="90" fill="#E3E9F1"/>
  <rect x="0" y="470" width="800" height="6" fill="#D3DCE8"/>

  <!-- immeubles secondaires -->
  <rect x="40" y="300" width="110" height="180" fill="#C9D6E6"/>
  <rect x="60" y="330" width="20" height="26" fill="#EAF2FB"/>
  <rect x="100" y="330" width="20" height="26" fill="#EAF2FB"/>
  <rect x="60" y="380" width="20" height="26" fill="#EAF2FB"/>
  <rect x="100" y="380" width="20" height="26" fill="#EAF2FB"/>
  <rect x="60" y="430" width="20" height="26" fill="#EAF2FB"/>
  <rect x="100" y="430" width="20" height="26" fill="#EAF2FB"/>

  <rect x="650" y="260" width="120" height="220" fill="#D3DCE8"/>
  <rect x="670" y="290" width="22" height="28" fill="#EAF2FB"/>
  <rect x="712" y="290" width="22" height="28" fill="#EAF2FB"/>
  <rect x="670" y="345" width="22" height="28" fill="#EAF2FB"/>
  <rect x="712" y="345" width="22" height="28" fill="#EAF2FB"/>
  <rect x="670" y="400" width="22" height="28" fill="#EAF2FB"/>
  <rect x="712" y="400" width="22" height="28" fill="#EAF2FB"/>

  <!-- perron -->
  <rect x="175" y="452" width="450" height="18" fill="#D3DCE8"/>
  <rect x="190" y="470" width="420" height="10" fill="#C9D6E6"/>

  <!-- bâtiment principal : la banque -->
  <polygon points="180,230 400,140 620,230" fill="url(#facade)"/>
  <rect x="190" y="228" width="420" height="16" fill="#16304F"/>

  <rect x="205" y="244" width="390" height="208" fill="url(#facade)"/>

  <!-- colonnes -->
  <g fill="#EAF2FB">
    <rect x="230" y="260" width="18" height="192"/>
    <rect x="300" y="260" width="18" height="192"/>
    <rect x="391" y="260" width="18" height="192"/>
    <rect x="482" y="260" width="18" height="192"/>
    <rect x="552" y="260" width="18" height="192"/>
  </g>

  <!-- porte en verre -->
  <rect x="360" y="360" width="80" height="92" fill="url(#glass)" rx="4"/>
  <line x1="400" y1="360" x2="400" y2="452" stroke="#1B3A63" stroke-width="3"/>

  <!-- fenetres -->
  <g fill="url(#glass)">
    <rect x="265" y="290" width="26" height="40" rx="3"/>
    <rect x="265" y="345" width="26" height="40" rx="3"/>
    <rect x="509" y="290" width="26" height="40" rx="3"/>
    <rect x="509" y="345" width="26" height="40" rx="3"/>
  </g>

  <!-- fronton avec le logo -->
  <polygon points="220,232 400,158 580,232" fill="#16304F"/>
  <circle cx="400" cy="205" r="20" fill="#22B378"/>
  <path d="M390 205 l7 7 l14 -16" stroke="#0F2A48" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- bandeau avec le nom -->
  <rect x="205" y="452" width="390" height="34" fill="#16304F" rx="4"/>
  <text x="400" y="475" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="2">SMARTFINANCE</text>

  <!-- drapeau -->
  <line x1="400" y1="158" x2="400" y2="120" stroke="#16304F" stroke-width="3"/>
  <polygon points="400,120 440,130 400,140" fill="#22B378"/>

  <!-- petits personnages pour donner vie -->
  <g>
    <circle cx="280" cy="500" r="9" fill="#1B3A63"/>
    <rect x="271" y="509" width="18" height="30" rx="6" fill="#2E5590"/>
  </g>
  <g>
    <circle cx="330" cy="504" r="8" fill="#22B378"/>
    <rect x="322" y="512" width="16" height="26" rx="6" fill="#189863"/>
  </g>
  <g>
    <circle cx="500" cy="500" r="9" fill="#E6484B"/>
    <rect x="491" y="509" width="18" height="30" rx="6" fill="#1B3A63"/>
  </g>
</svg>
